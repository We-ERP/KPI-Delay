<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI Delay Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --g1:#0f5132; --g2:#1e7b4a; --g3:#2fa36b; --gl:#e9f7ef;
    --r1:#a93226; --r2:#e74c3c; --rl:#fdecea;
    --y:#f4c430; --yl:#fff6d5;
    --w:#ffffff; --ink:#18271f; --muted:#68776f; --line:#dbe8e0; --bg:#f2f7f4;
    --shadow:0 6px 20px rgba(15,81,50,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);direction:ltr}
  header{background:linear-gradient(120deg,var(--g1),var(--g2) 60%,var(--g3));color:var(--w);padding:20px 30px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:var(--shadow)}
  header .brand{display:flex;align-items:center;gap:14px}
  header .logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:18px}
  header h1{margin:0;font-size:22px;letter-spacing:.3px}
  header .sub{font-size:12px;opacity:.8}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{border:none;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:14px;transition:transform .15s,box-shadow .15s,background .15s}
  button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.18)}
  button:active{transform:translateY(0)}
  .b-red{background:var(--r2);color:var(--w)}
  .b-white{background:var(--w);color:var(--g1)}
  .b-green{background:var(--g3);color:var(--w)}
  .tog{background:var(--w);color:var(--g1);padding:0;width:20px;height:20px;border-radius:5px;font-size:14px;line-height:18px;box-shadow:none;margin-left:6px}
  .tog:hover{transform:none;box-shadow:none}
  .search{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:var(--w);border-radius:10px;padding:9px 14px;font-size:14px;width:220px;outline:none}
  .search::placeholder{color:rgba(255,255,255,.75)}
  main{padding:24px 30px}
  .panel{background:var(--w);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:22px}
  .panel h2{margin:0 0 12px;font-size:15px;color:var(--g1)}
  .upload{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:12px;background:#fbfdfc;transition:.15s}
  .drop:hover{border-color:var(--g3);background:var(--gl)}
  .drop label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--g1);margin-bottom:6px}
  .drop label span{font-weight:400;color:var(--muted);font-size:11px}
  .drop input{width:100%;font-size:12px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
  .card{background:var(--w);border-radius:16px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--g2)}
  .card.red::before{background:var(--r2)}
  .card.yel::before{background:var(--y)}
  .card .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .card .val{font-size:30px;font-weight:800;margin:6px 0 10px;color:var(--g1)}
  .card.red .val{color:var(--r1)}
  .bar{height:8px;background:var(--gl);border-radius:20px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g3),var(--g2));border-radius:20px;transition:width .6s}
  .card.red .bar i{background:linear-gradient(90deg,var(--r2),var(--r1))}
  .card .sub{font-size:12px;color:var(--muted);margin-top:8px}
  .two{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:22px}
  @media (max-width:900px){.two{grid-template-columns:1fr}}
  .tl-row{display:grid;grid-template-columns:200px 1fr 60px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
  .tl-row b{color:var(--g1);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tl-row em{font-style:normal;text-align:right;font-weight:700}
  .tbl-wrap{background:var(--w);border-radius:16px;box-shadow:var(--shadow);overflow:auto;max-height:560px}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  thead th{position:sticky;background:var(--g2);color:var(--w);padding:9px 10px;text-align:center;white-space:nowrap;font-weight:700}
  thead tr:first-child th{top:0;z-index:3}
  thead tr:nth-child(2) th{top:38px;z-index:2;background:var(--g1);font-size:12px}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
  tbody td:first-child,tbody td:nth-child(2){text-align:left}
  tbody tr:nth-child(even){background:#f8fbf9}
  tbody tr:hover{background:var(--gl)}
  tbody tr.bad td{background:var(--rl)}
  .g-sched{background:var(--g2)!important}
  .g-reach{background:#1f8a7a!important}
  .g-qual{background:#2d6cdf!important}
  .g-abs{background:#8e6c2e!important}
  .g-audit{background:#6a4fb3!important}
  .g-fin{background:var(--g1)!important}
  .g-complaint{background:var(--y)!important;color:var(--ink)!important}
  .g-penalty{background:var(--r2)!important}
  .g-bonus{background:var(--g3)!important}
  .inp{width:74px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;text-align:center;font-size:13px;outline:none}
  .inp:focus{border-color:var(--g3);box-shadow:0 0 0 3px var(--gl)}
  .inp.y{background:var(--yl)}
  .inp.r{background:var(--rl)}
  .inp.g{background:var(--gl)}
  .pill{display:inline-block;padding:2px 10px;border-radius:20px;font-weight:700;font-size:12px}
  .pill.ok{background:var(--gl);color:var(--g1)}
  .pill.no{background:var(--rl);color:var(--r1)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--muted)}
  .log{min-height:18px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">KPI</div>
    <div>
      <h1>KPI Delay Dashboard</h1>
      <div class="sub">Final KPI per agent · Team leader summary</div>
    </div>
  </div>
  <div class="toolbar">
    <input class="search" id="q" placeholder="Search ID, name or TL..." oninput="setSearch(this.value)">
    <button class="b-red" onclick="resetAll()">Reset</button>
    <button class="b-white" onclick="runAll()">Run</button>
    <button class="b-green" onclick="exportXLSX()">Export</button>
  </div>
</header>

<main>

  <div class="panel">
    <h2>Source files</h2>
    <div class="upload">
      <div class="drop"><label>Staffed <span>schedule</span></label><input type="file" id="f_staffed" accept=".xlsx,.xlsm,.xls,.csv"></div>
      <div class="drop"><label>Comp <span>compensation</span></label><input type="file" id="f_comp" accept=".xlsx,.xlsm,.xls,.csv"></div>
      <div class="drop"><label>Q <span>quality</span></label><input type="file" id="f_q" accept=".xlsx,.xlsm,.xls,.csv"></div>
      <div class="drop"><label>Audit <span>audit scores</span></label><input type="file" id="f_audit" accept=".xlsx,.xlsm,.xls,.csv"></div>
      <div class="drop"><label>IR OTC <span>reachability</span></label><input type="file" id="f_ir" accept=".xlsx,.xlsm,.xls,.csv"></div>
      <div class="drop"><label>Str <span>structure (ID, name, TL)</span></label><input type="file" id="f_str" accept=".xlsx,.xlsm,.xls,.csv"></div>
    </div>
    <div class="foot"><span class="log" id="log">Upload files, then press Run.</span><span id="count"></span></div>
  </div>

  <div class="cards">
    <div class="card" id="c_agents"><div class="lbl">Agents</div><div class="val" id="v_agents">0</div><div class="bar"><i id="b_agents" style="width:0"></i></div><div class="sub" id="s_agents">—</div></div>
    <div class="card" id="c_pure"><div class="lbl">Pure hours</div><div class="val" id="v_pure">0</div><div class="bar"><i id="b_pure" style="width:0"></i></div><div class="sub" id="s_pure">—</div></div>
    <div class="card red" id="c_abs"><div class="lbl">Absence days</div><div class="val" id="v_abs">0</div><div class="bar"><i id="b_abs" style="width:0"></i></div><div class="sub" id="s_abs">Absent + Sick + Emergency</div></div>
    <div class="card" id="c_qual"><div class="lbl">Avg quality</div><div class="val" id="v_qual">0%</div><div class="bar"><i id="b_qual" style="width:0"></i></div><div class="sub" id="s_qual">—</div></div>
    <div class="card yel" id="c_aud"><div class="lbl">Audit coverage</div><div class="val" id="v_aud">0</div><div class="bar"><i id="b_aud" style="width:0"></i></div><div class="sub" id="s_aud">—</div></div>
    <div class="card" id="c_final"><div class="lbl">Avg final KPI</div><div class="val" id="v_final">0%</div><div class="bar"><i id="b_final" style="width:0"></i></div><div class="sub" id="s_final">—</div></div>
  </div>

  <div class="two">
    <div class="panel">
      <h2>Final KPI</h2>
      <div class="tbl-wrap">
        <table id="tbl"><thead></thead><tbody></tbody></table>
      </div>
    </div>
    <div class="panel">
      <h2>Team leaders</h2>
      <div id="tl"></div>
    </div>
  </div>

</main>

<script>
/* ===================== CONFIG ===================== */
const CODES = {
  pure:    ["Phone", "Covering E.C", "Covering HSH instability"],
  absence: ["Absent", "Sick Leave", "Emergency"]
};
const COL = {
  ir:    {id:"Login ID", reached:"Reached", noCall:"No call", points:"Points total", floor:"Floor"},
  audit: {user:"UN", score:"Score"},
  q:     {agentId:"Agent ID", count:"Count of monitored sheets", ctc:"Sum of clear CTC agent", ctb:"Sum of clear CTB agent", nc:"Sum of NC"}
};

/* column groups: first column of each group is the summary shown when collapsed */
const pct = v => (v*100).toFixed(1)+"%";
const w2  = v => v.toFixed(2);
const GROUPS = [
  {id:"sched", title:"Schedule", cols:[
    {k:"pure",  label:"Pure (h)", f:v=>v.toFixed(2)},
    {k:"comp",  label:"Comp (h)", f:v=>v.toFixed(2)},
    {k:"pph",   label:"Pts / h",  f:v=>v.toFixed(1)},
    {k:"prodW", label:"Prod W",   f:w2}]},
  {id:"reach", title:"Reachability", cols:[
    {k:"reach",  label:"Reach %", f:pct},
    {k:"reachW", label:"Reach W", f:w2}]},
  {id:"qual", title:"Quality", cols:[
    {k:"monitored", label:"Sheets",    f:v=>v},
    {k:"qualAcc",   label:"Quality %", f:pct},
    {k:"qualW",     label:"Quality W", f:w2}]},
  {id:"abs", title:"Absence", cols:[
    {k:"absDays", label:"Days",      f:v=>v},
    {k:"absW",    label:"Absent W",  f:w2}]},
  {id:"audit", title:"Audit", cols:[
    {k:"audit",  label:"Score",   f:v=>v===null?"Pending":pct(v)},
    {k:"auditW", label:"Audit W", f:w2}]},
  {id:"fin", title:"Final", cols:[
    {k:"total",     label:"Total KPI", f:pct},
    {k:"complaint", label:"Complaint", input:true, cls:"y", g:"complaint"},
    {k:"penalty",   label:"Penalty %", input:true, cls:"r", g:"penalty"},
    {k:"bonus",     label:"Bonus %",   input:true, cls:"g", g:"bonus"},
    {k:"final",     label:"Final KPI", f:pct}]}
];

/* ===================== STATE ===================== */
const DATA = {};
const ADJ  = {};                       // id -> {complaint, penalty, bonus}
const RESULT = {agents:[]};
const STATE  = {collapsed:{}, search:""};

const adjOf = id => (ADJ[id] ??= {complaint:0, penalty:0, bonus:0});

/* ===================== HELPERS ===================== */
const log = msg => document.getElementById("log").textContent = msg;
const clean = v => (v === undefined || v === null) ? "" : String(v).trim();

function parseDuration(v){
  if (v === null || v === undefined || v === "") return 0;
  if (typeof v === "number") return v * 24;
  const p = String(v).trim().split(":").map(Number);
  if (p.some(isNaN)) return 0;
  return (p[0]||0) + (p[1]||0)/60 + (p[2]||0)/3600;
}

function readFile(input){
  return new Promise((res, rej)=>{
    const f = input.files[0];
    if (!f) return res(null);
    const r = new FileReader();
    r.onload = e => {
      const wb = XLSX.read(e.target.result, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      res(XLSX.utils.sheet_to_json(ws, {defval:"", raw:true}));
    };
    r.onerror = rej;
    r.readAsArrayBuffer(f);
  });
}

async function loadAll(){
  const map = {staffed:"f_staffed", comp:"f_comp", q:"f_q", audit:"f_audit", ir:"f_ir", str:"f_str"};
  for (const k in map) DATA[k] = await readFile(document.getElementById(map[k]));
}

/* ===================== CALCULATIONS ===================== */
function calcAll(){
  const staffed = DATA.staffed || [];
  const comp    = DATA.comp    || [];
  const q       = DATA.q       || [];
  const audit   = DATA.audit   || [];
  const ir      = DATA.ir      || [];

  const agents = {};
  const get = id => (agents[id] ??= {id, pure:0, absent:0, sick:0, emerg:0, comp:0, name:"", tl:"",
                                      reached:0, trials:0, points:0, ctc:0, ctb:0, nc:0, monitored:0});

  for (const r of staffed){
    const id = clean(r["ID"]);
    if (!id) continue;
    const a = get(id);
    a.name = a.name || r["Agent Name"];
    a.tl   = a.tl   || r["TL"];
    const code = String(r["Code"]).trim();
    const hrs  = parseDuration(r["Duration"]);
    if (CODES.pure.includes(code)) a.pure   += hrs;
    if (code === "Absent")         a.absent += 1;
    if (code === "Sick Leave")     a.sick   += 1;
    if (code === "Emergency")      a.emerg  += 1;
  }

  // Str: column A = ID, C = Name, E = TL
  for (const r of (DATA.str || [])){
    const v = Object.values(r);
    const id = String(v[0] ?? "").trim();
    if (!id || !agents[id]) continue;
    agents[id].name = v[2] || agents[id].name;
    agents[id].tl   = v[4] || agents[id].tl;
  }

  for (const r of comp){
    const id = clean(r["ID"]);
    if (!id) continue;
    get(id).comp += parseDuration(r["Code Time"]);
  }

  for (const r of q){
    const id = String(r[COL.q.agentId] || "").trim();
    if (!id || !agents[id]) continue;
    const a = agents[id];
    a.monitored += Number(r[COL.q.count]) || 0;
    a.ctc += Number(r[COL.q.ctc]) || 0;
    a.ctb += Number(r[COL.q.ctb]) || 0;
    a.nc  += Number(r[COL.q.nc])  || 0;
  }

  const auditByUN = {};
  for (const r of audit) auditByUN[String(r[COL.audit.user]).trim()] = Number(r[COL.audit.score]) || null;

  for (const r of ir){
    const id = String(r[COL.ir.id] || "").trim();
    if (!id || !agents[id]) continue;
    const a = agents[id];
    const st = String(r[COL.ir.reached] || "").trim();
    if (st === "Reached") a.reached++;
    if (st !== COL.ir.noCall) a.trials++;
    if (String(r[COL.ir.floor]).trim() === "Floor") a.points += Number(r[COL.ir.points]) || 0;
  }

  const out = [];
  for (const id in agents){
    const a = agents[id];
    const hours = Math.max(0, a.pure - a.comp);          // all comp deducted from pure
    const pph   = hours > 0 ? a.points / hours : 0;
    const prodW = pph >= 60 ? 0.3 : pph >= 54 ? 0.2 : pph >= 48 ? 0.1 : 0;

    const reach  = a.trials > 0 ? a.reached / a.trials : 0;
    const reachW = reach >= 0.92 ? 0.2 : reach >= 0.9 ? 0.12 : reach >= 0.8 ? 0.06 : 0;

    const ctc = a.monitored ? a.ctc / a.monitored : 0;
    const ctb = a.monitored ? a.ctb / a.monitored : 0;
    const nc  = a.monitored ? a.nc  / a.monitored : 0;
    const qualAcc = ctc*0.7 + ctb*0.2 + nc*0.1;
    const qualW   = qualAcc * 0.1;

    const absDays = a.absent + a.sick + a.emerg;
    const absW = absDays === 0 ? 0.1 : absDays === 1 ? 0.05 : 0;

    const auditScore = auditByUN[a.name] ?? null;
    const auditW = auditScore === null ? 0 : auditScore >= 0.95 ? 0.3 : auditScore >= 0.85 ? 0.2 : auditScore >= 0.75 ? 0.1 : 0;

    const total = prodW + reachW + qualW + auditW + absW;

    out.push({id, name:a.name, tl:a.tl, pure:hours, comp:a.comp, pph, prodW,
              reach, reachW, monitored:a.monitored, qualAcc, qualW,
              absDays, absW, audit:auditScore, auditW, total});
  }
  return out;
}

function finalize(row){
  const a = adjOf(row.id);
  row.complaint = a.complaint;
  row.penalty   = a.penalty;
  row.bonus     = a.bonus;
  row.final     = row.total + a.penalty/100 + a.bonus/100;
  return row;
}

/* ===================== RENDER ===================== */
function setSearch(v){ STATE.search = v.toLowerCase(); renderTable(); }

function visibleRows(){
  const q = STATE.search;
  return RESULT.agents.filter(r => !q || `${r.id} ${r.name} ${r.tl}`.toLowerCase().includes(q));
}

function cellHTML(r, c, g){
  if (c.input){
    const v = adjOf(r.id)[c.k];
    return `<td><input type="number" step="0.5" class="inp ${c.cls}" value="${v}" onchange="setAdj('${r.id}','${c.k}',this.value)"></td>`;
  }
  const tag = c.k === "final" ? ` data-final="${r.id}"` : "";
  return `<td${tag}>${c.f(r[c.k])}</td>`;
}

function renderTable(){
  const thead = document.querySelector("#tbl thead");
  const tbody = document.querySelector("#tbl tbody");
  let h1 = `<tr><th colspan="3" style="background:var(--g1)">Agent</th>`;
  for (const g of GROUPS){
    const c = STATE.collapsed[g.id];
    h1 += `<th colspan="${c?1:g.cols.length}" class="g-${g.id}">${g.title}<button class="tog" onclick="toggleGroup('${g.id}')">${c?'+':'−'}</button></th>`;
  }
  h1 += "</tr>";
  let h2 = `<tr><th>ID</th><th>Name</th><th>TL</th>`;
  for (const g of GROUPS){
    const cols = STATE.collapsed[g.id] ? g.cols.slice(0,1) : g.cols;
    h2 += cols.map(c=>`<th>${c.label}</th>`).join("");
  }
  h2 += "</tr>";
  thead.innerHTML = h1 + h2;

  const rows = visibleRows();
  tbody.innerHTML = rows.map(r=>{
    let tds = `<td>${r.id}</td><td>${r.name||""}</td><td>${r.tl||""}</td>`;
    for (const g of GROUPS){
      const cols = STATE.collapsed[g.id] ? g.cols.slice(0,1) : g.cols;
      tds += cols.map(c=>cellHTML(r, c, g)).join("");
    }
    const bad = r.final < 0.5 ? " class='bad'" : "";
    return `<tr${bad}>${tds}</tr>`;
  }).join("");

  document.getElementById("count").textContent = `Showing ${rows.length} of ${RESULT.agents.length}`;
}

function toggleGroup(id){
  STATE.collapsed[id] = !STATE.collapsed[id];
  renderTable();
}

function setAdj(id, k, val){
  adjOf(id)[k] = Number(val) || 0;
  const row = RESULT.agents.find(x=>x.id===id);
  if (!row) return;
  finalize(row);
  const cell = document.querySelector(`[data-final="${id}"]`);
  if (cell) cell.textContent = pct(row.final);
  renderCards();
  renderTL();
}

function setCard(id, val, pctFill, sub){
  document.getElementById("v_"+id).textContent = val;
  document.getElementById("b_"+id).style.width = Math.max(0, Math.min(100, pctFill)) + "%";
  document.getElementById("s_"+id).textContent = sub;
}

function renderCards(){
  const rows = RESULT.agents;
  const n = rows.length;
  if (!n){
    ["agents","pure","abs","qual","aud","final"].forEach(k=>setCard(k,"0",0,"—"));
    return;
  }
  const pure = rows.reduce((s,r)=>s+r.pure,0);
  const abs  = rows.reduce((s,r)=>s+r.absDays,0);
  const qual = rows.reduce((s,r)=>s+r.qualAcc,0)/n;
  const aud  = rows.filter(r=>r.audit!==null).length;
  const fin  = rows.reduce((s,r)=>s+r.final,0)/n;

  setCard("agents", n, 100, "Agents in structure");
  setCard("pure",   pure.toFixed(1)+" h", 100, "Net pure time after comp");
  setCard("abs",    abs, Math.min(100, abs), "Absent + Sick + Emergency");
  setCard("qual",   pct(qual), qual*100, "Weighted accuracy");
  setCard("aud",    aud+" / "+n, n?aud/n*100:0, "Agents with audit score");
  setCard("final",  pct(fin), fin*100, "Average Final KPI");
}

function renderTL(){
  const box = document.getElementById("tl");
  const map = {};
  for (const r of RESULT.agents){
    const k = r.tl || "Unassigned";
    (map[k] ??= []).push(r.final);
  }
  const rows = Object.entries(map).map(([tl,arr])=>({tl, avg: arr.reduce((a,b)=>a+b,0)/arr.length, n:arr.length}))
                                  .sort((a,b)=>b.avg-a.avg);
  if (!rows.length){ box.innerHTML = "<div class='foot'>No data yet.</div>"; return; }
  box.innerHTML = rows.map(x=>`
    <div class="tl-row">
      <b title="${x.tl}">${x.tl} <span style="color:var(--muted);font-weight:400">(${x.n})</span></b>
      <div class="bar"><i style="width:${Math.max(0,Math.min(100,x.avg*100))}%"></i></div>
      <em>${pct(x.avg)}</em>
    </div>`).join("");
}

/* ===================== ACTIONS ===================== */
async function runAll(){
  try{
    log("Loading files...");
    await loadAll();
    if (!DATA.staffed){ log("Upload at least the Staffed file."); return; }
    if (DATA.staffed.length && !("ID" in DATA.staffed[0])){
      log("Staffed file: column 'ID' not found. Found: " + Object.keys(DATA.staffed[0]).join(", "));
      return;
    }
    RESULT.agents = calcAll().map(finalize);
    renderTable();
    renderCards();
    renderTL();
    log("Done.");
  }catch(e){ log("Error: "+e.message); console.error(e); }
}

function resetAll(){
  ["f_staffed","f_comp","f_q","f_audit","f_ir","f_str"].forEach(id=>document.getElementById(id).value="");
  for (const k in DATA) delete DATA[k];
  for (const k in ADJ) delete ADJ[k];
  RESULT.agents = [];
  STATE.collapsed = {};
  document.getElementById("q").value = "";
  STATE.search = "";
  document.querySelector("#tbl thead").innerHTML = "";
  document.querySelector("#tbl tbody").innerHTML = "";
  document.getElementById("tl").innerHTML = "";
  document.getElementById("count").textContent = "";
  renderCards();
  log("Reset done.");
}

function exportXLSX(){
  if (!RESULT.agents.length){ log("Run first, then export."); return; }
  const rows = RESULT.agents.map(r=>({
    "Agent ID":r.id, "Name":r.name, "TL":r.tl,
    "Pure (h)":+r.pure.toFixed(2), "Comp (h)":+r.comp.toFixed(2), "Pts/h":+r.pph.toFixed(2),
    "Prod W":+r.prodW.toFixed(2), "Reach %":+(r.reach*100).toFixed(1), "Reach W":+r.reachW.toFixed(2),
    "Sheets":r.monitored, "Quality %":+(r.qualAcc*100).toFixed(1), "Quality W":+r.qualW.toFixed(3),
    "Absence Days":r.absDays, "Absent W":+r.absW.toFixed(2),
    "Audit":r.audit===null?"Pending":+(r.audit*100).toFixed(1), "Audit W":+r.auditW.toFixed(2),
    "Total KPI %":+(r.total*100).toFixed(1), "Complaint":r.complaint,
    "Penalty %":r.penalty, "Bonus %":r.bonus, "Final KPI %":+(r.final*100).toFixed(1)
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Final KPI");
  XLSX.writeFile(wb, "KPI_Delay_Final.xlsx");
  log("Exported KPI_Delay_Final.xlsx");
}

renderCards();
</script>
